[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topology"
version = "1.0.0"
description = "Turn real-world terrain into layered CNC carving files (SVG pockets + STL)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3.9",
  "pyogrio>=0.7",
  "pillow>=10",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "trimesh>=4", "httpx>=0.27"]

[project.scripts]
topology = "topology.cli:main"

[tool.setuptools.packages.find]
include = ["topology*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
